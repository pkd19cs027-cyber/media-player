name: flix_local
description: A Netflix-style local video player application for mobile.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.2
  chewie: ^1.7.4
  file_picker: ^8.0.0+1
  provider: ^6.1.2
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  mime: ^1.0.5
  video_thumbnail: ^0.5.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
